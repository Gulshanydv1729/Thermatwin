version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: thermatwin
      POSTGRES_PASSWORD: thermatwin
      POSTGRES_DB: thermatwin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thermatwin"]
      interval: 5s
      timeout: 5s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: thermatwin
      POSTGRES_PASSWORD: thermatwin
      POSTGRES_DB: thermatwin
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thermatwin"]
      interval: 5s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:2.7
    environment:
      INFLUXDB_ADMIN_USER: thermatwin
      INFLUXDB_ADMIN_PASSWORD: thermatwin123
      INFLUXDB_ORG: thermatwin
      INFLUXDB_BUCKET: vfd_telemetry
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: thermatwin
      DOCKER_INFLUXDB_INIT_PASSWORD: thermatwin123
      DOCKER_INFLUXDB_INIT_ORG: thermatwin
      DOCKER_INFLUXDB_INIT_BUCKET: vfd_telemetry
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: thermatwin-token
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    depends_on:
      postgres:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    environment:
      THERMATWIN_POSTGRES_HOST: postgres
      THERMATWIN_TIMESCALEDB_HOST: timescaledb
      THERMATWIN_TIMESCALEDB_PORT: 5432
      THERMATWIN_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      THERMATWIN_MQTT_HOST: mosquitto
    ports:
      - "8000:8000"

  ingestion:
    build:
      context: .
      dockerfile: Dockerfile.ingestion
    depends_on:
      kafka:
        condition: service_started
      mosquitto:
        condition: service_started
    environment:
      THERMATWIN_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      THERMATWIN_MQTT_HOST: mosquitto
      THERMATWIN_TIMESCALEDB_HOST: timescaledb
      THERMATWIN_TIMESCALEDB_PORT: 5432

volumes:
  postgres_data:
  timescaledb_data:
  influxdb_data:
