[pytest]
# The repository root is on the path so that both the new backend package and
# the preserved legacy prototype import cleanly from a bare checkout.
pythonpath = .

# Two suites, both of which must stay green:
#   backend/tests  the SIH26120 digital twin (physics, AI, engine, API)
#   tests          the preserved Streamlit prototype
testpaths = backend/tests tests

# asyncio_mode = auto lets the async WebSocket tests be written as plain
# `async def` without decorating every one of them.
asyncio_mode = auto

# The AI models train inside the test session (a few seconds each) and the
# legacy prototype starts a Streamlit runtime, so the suite is not fast and a
# few machine-dependent timings are asserted.  Failures are still real failures;
# only the flakiness filters below are relaxed.
filterwarnings =
    ignore::DeprecationWarning:starlette.*
    ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning
